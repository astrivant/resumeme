name: Verify delivered release stage
on:
  workflow_call:
    inputs:
      sha:
        description: Immutable source that must match the public signed release
        type: string
        required: true
      results:
        description: Required delivery job outcomes from the caller
        type: string
        required: true
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    name: Verify published tag artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Require every intended delivery stage
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RESULTS_JSON: ${{ inputs.results }}
        run: bash scripts/release/check-delivery.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-resume
          path: .cache/expected-release/
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Download and verify the actual public release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release/check-published.sh
