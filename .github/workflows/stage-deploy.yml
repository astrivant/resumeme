name: Deploy stage
on:
  workflow_call:
    inputs:
      sha:
        description: Verified source commit whose PDF may be published
        type: string
        required: true
      refresh:
        description: Commit the verified capture and referenced assets with the PDF
        type: boolean
        default: false
    secrets:
      RESUME_PUBLISH_TOKEN:
        description: Optional contents-write token whose owner can bypass protected main reviews and checks
        required: false
    outputs:
      published-sha:
        description: Accepted main commit, empty when publication was superseded
        value: ${{ jobs.publish.outputs.sha }}
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
    name: Commit verified PDF to main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.publish.outputs.published-sha }}

    # Serialize PDF writers; publish.sh still checks for branch movement before committing or releasing an artifact.
    concurrency:
      group: resumeme-pdf-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          # GITHUB_TOKEN remains sufficient for forks without branch protection.
          token: ${{ secrets.RESUME_PUBLISH_TOKEN || github.token }}
      - uses: ./.github/actions/setup-project
        with:
          groups: main
      - uses: ./.github/actions/restore-profile
        with:
          refresh: ${{ inputs.refresh }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resume-pdf
          path: .cache/publication/
      - name: Resolve convergence publication preference
        id: convergence
        if: inputs.refresh
        run: poetry run python scripts/ci/publication/convergence.py enabled >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.refresh && steps.convergence.outputs.enabled == 'true'
        with:
          name: capture-convergence
          path: .cache/convergence/
      - name: Publish only if main has not advanced
        id: publish
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          REFRESH_PROFILE: ${{ inputs.refresh }}
          RESUMEME_REPOSITORY_FORK: ${{ github.event.repository.fork == true }}
          RESUMEME_PUBLISH_USES_TOKEN: ${{ secrets.RESUME_PUBLISH_TOKEN != '' }}
        run: bash scripts/ci/publication/publish.sh
