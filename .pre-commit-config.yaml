default_install_hook_types: [pre-commit, pre-push]
default_language_version:
  python: python3.13
  node: 26.10.0
repos:
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.10.0
    hooks:
      - id: eslint
        name: ESLint browser and validation scripts
        args: [--config, .config/eslint.config.mjs]
        files: '^(pkg/resumeme/linkedin/scripts/.*\.js|scripts/validation/math/.*\.mjs)$'
  - repo: local
    hooks:
      - id: codeowners-tree
        name: Normalize CODEOWNERS directory tree
        entry: bash scripts/tooling/project-python.sh -m ownerloom --write
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]
      - id: codeowners-tree-push
        name: Check committed CODEOWNERS directory tree
        entry: bash scripts/tooling/project-python.sh -m ownerloom --check --revision HEAD
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: codeowners
        name: CODEOWNERS syntax and paths
        entry: env REPOSITORY_PATH=. CHECKS=files,duppatterns,syntax EXPERIMENTAL_CHECKS= CHECK_FAILURE_LEVEL=warning codeowners-validator
        language: golang
        language_version: 1.27.2
        additional_dependencies:
          - github.com/mszostok/codeowners-validator@7f3f5e28c6d7b8dfae5731e54ce2272ca384592f # v0.7.4
        pass_filenames: false
        always_run: true
      - id: documentation-contents
        name: README table of contents
        entry: bash scripts/tooling/project-python.sh scripts/documentation/contents.py --check
        language: system
        pass_filenames: false
        always_run: true
      # Run the published hook command against the latest checkout, using the project's existing locked environment.
      - id: resumeme-config-validator
        name: Validate resumeme configurations
        entry: bash scripts/tooling/project-python.sh -m resumeme.cli config lint
        language: system
        files: '^(resumeme\.config\.yaml|\.config/resumeme\.config\.ref\.yaml)$'
        types: [yaml]
        require_serial: true
      - id: pydocstyle
        name: Google docstring style
        entry: bash scripts/tooling/project-python.sh -m pydocstyle --config=pyproject.toml
        language: system
        types: [python]
      - id: pydoclint
        name: Typed docstring contracts
        entry: bash scripts/tooling/project-python.sh -m pydoclint.main --config=pyproject.toml
        language: system
        types: [python]
      - id: ruff-check
        name: Ruff lint
        entry: bash scripts/tooling/project-python.sh -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: bash scripts/tooling/project-python.sh -m ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Strict mypy
        entry: bash scripts/tooling/project-python.sh -m mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: shellcheck
        name: ShellCheck and shfmt
        entry: bash scripts/validation/check-shell.sh
        language: system
        types: [shell]
      - id: schemas
        name: Configuration and profile schemas
        entry: bash scripts/tooling/project-python.sh scripts/validation/check-data.py
        language: system
        pass_filenames: false
        files: '(\.json$|\.yaml$|\.yml$|^Dockerfile$|^pkg/resumeme/(config/.*\.py|compiler/asts/.*\.py)$)'
      - id: document-math
        name: Markdown math syntax and worked examples
        entry: bash scripts/validation/check-math.sh
        language: system
        pass_filenames: false
        files: '(?i)(\.(md|markdown)$|^scripts/validation/(math/|check-math\.sh$)|^pkg/resumeme/linkedin/capture/.*\.py$|^\.pre-commit-config\.yaml$)'
