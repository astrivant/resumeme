# yaml-language-server: $schema=./pkg/resumeme/compiler/asts/resources/config.schema.json

# Cross-cutting runtime diagnostics. Keep this near the top so CI behavior is obvious.
logging:
  level: ERROR

# Browser and network behavior used while acquiring and enriching a profile.
capture:
  # Start with six workers; resize by one only when measured time/cost savings justify it.
  sharding:
    enabled: true
    initial: 6
    minimum: 2
    maximum: 12
    cooldown_runs: 3
  browser: firefox
  page_timeout_seconds: 30
  app_approval_timeout_seconds: 900
  max_scrolls: 60
  max_pages_per_section: 30
  fetch_link_previews: true
  retry_attempts: 5
  retry_backoff_seconds: 10
  retry_max_backoff_seconds: 300

# Profile identity and the sections selected from the captured source.
profile:
  linkedin:
    username: emmeowzing

  github:
    username: emmeowzing
    contributions:
      enabled: true
      months: 1
      placement: profile
      as_of: null

  sections:
    # Reorder entries; comment out a key to hide it. Missing/empty sections are skipped.
    order:
      - contact
      - about
      # - featured
      # - activity
      - experience
      - education
      # - services
      # - career-breaks
      # - certifications
      # - volunteering-experiences
      - projects
      - publications
      # - patents
      # - courses
      # - honors
      # - test-scores
      - skills
      # - recommendations
      # - languages
      # - organizations
      # - interests
      # - causes

    projects:
      # Null includes all resolved project URLs; a Python regex can restrict the source.
      source_url_filter: null
      include:
        - name: polyad
        - name: hypothesis-helm
        - name: composer
        - name: resumeme
        - name: orchidarium
        - name: pass-operator
      exclude:
        - affiliation: HqO
        - name: gitlabci-lint-pre-commit-hook

    experience:
      disable:
        # - company: astrivant
        - company: Tiger Lily Plants LLC.
        - title: Founder
          company: PremiScale
      last_years: 5
      since: '2021-08-01'
      as_of: null
      reflow_soft_breaks: true
      subheadings:
        - Responsibilities
        - Key responsibilities
        - Technologies
        - Projects
        - Skills
        - Achievements
        - Key achievements
        - Accomplishments
        - Highlights
        - Summary
        - Duties

    education:
      disable:
        - school: Rochester Institute of Technology

# Resume compilation inputs, generated paths, and visual presentation.
document:
  # Optional evidence figures. Reorder these keys; include narrows enabled figures and exclude wins.
  appendices:
    awareness:
      figures:
        knowledge-usage: false
        knowledge-map: true
        decision-influences: true
        knowledge-hierarchy: false
        toolbox-use: false
        problem-repertoire: false
        checkpoint-transitions: false
        checkpoint-comparisons: false
      include: [] # For example: [{group: knowledge}] or [{id: knowledge-usage}]
      exclude: [] # Filters accept id, group, or both.

  output:
    profile: data/profile.json
    assets: data/assets
    tex: tex/resume.tex
    pdf: resume.pdf

  style:
    profile_column_side: right
    profile_column_wrap: false
    # Fractions of available body width: page 1's column and page 2 onward, independently.
    first_page_body_width: 0.98
    later_page_body_width: 0.75
    # Caption blocks stay centered below figures; alignment controls the text inside them.
    figure_caption_width: 0.8
    figure_caption_alignment: center # left, center, or right
    line_height: 1.0
    paragraph_spacing: 3
    about_text_indent: 8
    about_background: null
    display_location: false
    show_headline: false
    display_current_position: null
    theme: tiger
    paper: letter
    accent: '245135'
    skill_colors: ['363636', '777777']
    background: FFFFFF
    font_size: 10
    ink: '363636'
    entry_color: '363636'
    company_font_size: 13
    company_color: '191919'
    show_header_photo: false
    display_profile_photo: false
    show_table_of_contents: true
    highlight_job_subheadings: true
    show_connection_count: false
    show_connection_link: false
    display_birthday: false
    display_phone: false
    display_websites: false
    website_icon: null
    skills_word_cloud: true
    skills_allow_vertical: true
    skills_size_legend: false
    themes:
      tiger:
        accent: '245135'
        ink: '363636'
        name_color: '6B2737'
        heading_color: 'A44813'
        entry_color: '363636'
        company_color: '6B2737'
        skill_colors: ['3B1F16', 'D77A2A']

  template: null

# External publication targets and release follow-up actions.
publishing:
  linkedin:
    resume:
      publish: true
      replace_existing: true
      share_with_recruiters: true
    ownership:
      update_about: true
      repository: null
      releases_url: null

  readme:
    mode: resume
    output: docs/FORK_EXAMPLE.md
    introduction: null

  pages:
    enabled: true
    path: /
    custom_domain: resume.tiger-lily-plants.com

# Optional AI-assisted generation and employer-specific resume variants.
automation:
  # Accept GitHub-authenticated rebuild requests only from explicitly allowed account/App logins.
  awareness:
    enabled: true
    allowed_actors: [emmeowzing]

  codex:
    enabled: false
    model: gpt-6-astra
    reasoning_effort: low
    about_max_words: 100
    headline_max_words: 18
    context: ''
    skills:
      enabled: false
      publish: false
      max_skills: 20
      context: ''
    companies: []
    # companies:
    #   - username: example-company
    #     job_url: https://www.linkedin.com/jobs/view/1234567890/
    #     context: Emphasize platform reliability and developer tooling.
    #     company_context: ''
    #     job_context: ''
