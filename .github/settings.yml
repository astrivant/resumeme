# Synced to GitHub by the Settings app when this file reaches the default branch.
repository:
  name: resumeme
  description: Turn your LinkedIn profile into a polished PDF resume, built and signed with GitHub Actions
  homepage: https://pypi.org/project/resumeme/
  has_issues: true
  has_projects: false
  has_wiki: false
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
  delete_branch_on_merge: true
  enable_vulnerability_alerts: true

branches:
  - name: main
    protection:
      required_status_checks:
        strict: true
        contexts:
          # This gate fails if any required test or build stage fails, skips, or is cancelled.
          - CI verification
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_last_push_approval: true
      required_conversation_resolution: true
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false

      # Administrators retain bypass; publication uses RESUME_PUBLISH_TOKEN or the documented upstream fallback.
      enforce_admins: false
      restrictions: null
