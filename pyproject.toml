[project]
name = "resumeme"
version = "0.5.0"
description = "Turn your LinkedIn profile into a polished PDF resume, built and signed with GitHub Actions"
authors = [{name = "Emma Doyle"}]
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE"]
requires-python = ">=3.13,<4.0"
keywords = ["resume", "cv", "linkedin", "latex", "pdf", "github-actions", "automation", "cosign"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Typing :: Typed",
]

# Allow patch releases within the verified major/minor lines; poetry.lock pins the installed versions.
dependencies = [
    "requests>=2.34.2,<2.35",
    "urllib3>=2.8.0,<2.9",
    "selenium>=4.50.0,<4.51",
    "beautifulsoup4>=4.15.0,<4.16",
    "PyYAML>=6.0.3,<6.1",
    "attrs>=26.1.0,<26.2",
    "cattrs>=26.2.1,<26.3",
    "Jinja2>=3.1.6,<3.2",
    "jsonschema>=4.26.0,<4.27",
    "Pillow>=12.3.0,<12.4",
    "wordcloud>=1.9.6,<1.10",
    "matplotlib>=3.11.2,<3.12",
    "pypdf>=6.19.0,<6.20",
    "opentelemetry-sdk>=1.45.1,<1.46",
    "opentelemetry-instrumentation-logging>=0.66b1,<0.67",
    "cryptography>=50.0.2,<50.1",
]

[project.scripts]
resumeme = "resumeme.cli:main"

[project.urls]
Repository = "https://github.com/astrivant/resumeme"
Documentation = "https://github.com/astrivant/resumeme/blob/main/docs/README.md"
Issues = "https://github.com/astrivant/resumeme/issues"
Changelog = "https://github.com/astrivant/resumeme/releases"

[tool.poetry]
packages = [{include = "resumeme", from = "pkg"}]
include = [
    {path = "pkg/resumeme/compiler/asts/resources/**/*", format = ["sdist", "wheel"]},
    {path = "pkg/resumeme/compiler/backends/latex/resources/**/*", format = ["sdist", "wheel"]},
    {path = "pkg/resumeme/github/resources/**/*", format = ["sdist", "wheel"]},
    {path = "pkg/resumeme/linkedin/scripts/**/*.js", format = ["sdist", "wheel"]},
]
exclude = ["pkg/resumeme/tests"]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<9.2"
pytest-cov = ">=7.1.0,<7.2"
pytest-xdist = ">=3.8.0,<3.9"
hypothesis = ">=6.168.5,<6.169"
ruff = ">=0.16.10,<0.17"
mypy = ">=2.4.0,<2.5"
pre-commit = ">=4.6.2,<4.7"
pydocstyle = ">=6.3.0,<6.4"
pydoclint = ">=0.11.0,<0.12"
types-requests = ">=2.33.0.20261006,<2.34"
types-PyYAML = ">=6.0.12.20260906,<6.1"
types-jsonschema = ">=4.26.0.20261006,<4.27"
shellcheck-py = ">=0.11.0.1,<0.12"
shfmt-py = ">=4.2.0,<4.3"
ownerloom = {version = "0.0.1", python = ">=3.13,!=3.14.1,<4.0"}

[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["pkg/resumeme/tests", "tests"]
pythonpath = ["."]

# Share CPU-based worker selection between local runs and CI; use -n 0 when debugging a single process.
addopts = "-p resumeme.tests.sharding -ra -n auto -m 'not browser_e2e'"
markers = ["browser_e2e: real Firefox or Chrome capture tests against a local fixture server"]

[tool.coverage.run]
relative_files = true
source = ["pkg/resumeme"]
omit = ["*/tests/*"]
data_file = ".cache/coverage/.coverage"

[tool.ruff]
src = ["pkg"]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "TC"]
ignore = ["D200", "D202", "D212"]
extend-select = ["D213"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-type-checking]
strict = true
exempt-modules = []
runtime-evaluated-decorators = ["attrs.define", "attrs.frozen"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
mypy_path = ["scripts/typing"]
exclude = ["scripts/typing/"]
python_version = "3.13"
strict = true
files = ["pkg", "scripts", "tests"]
disallow_any_explicit = true
disallow_any_unimported = true

[tool.pydocstyle]
convention = "google"
add-ignore = ["D200", "D202", "D212"]
add-select = ["D213"]
match = ".*\\.py"

[tool.pydoclint]
style = "google"
skip-checking-short-docstrings = false
arg-type-hints-in-docstring = true
arg-type-hints-in-signature = true
check-return-types = true
check-arg-order = true
allow-init-docstring = true
require-return-section-when-returning-nothing = true
skip-checking-raises = true
