name: Resumeme pipeline
on:
  push:
    # The figure-only transport branch dispatches an explicit rebuild; its push must not start a second pipeline.
    branches: ['**', '!witful-awareness']
    tags: ['**']
  pull_request:
  repository_dispatch:
    types: [witful-awareness]
  schedule:
    # Refresh on the first of each month at 06:17 UTC, away from the busiest start-of-hour queue.
    - cron: '17 6 1 * *'
    # Update Scorecard weekly without running capture, summaries, or resume publication.
    - cron: '43 6 * * 1'
  workflow_dispatch:
    inputs:
      refresh:
        description: Capture LinkedIn again before rebuilding main
        type: boolean
        default: false
      pages_only:
        description: Republish the accepted main PDF to Pages without capture or rebuilding
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Every tag shares one run-level lock; branch and PR runs keep their existing independent groups.
  group: >-
    ${{ startsWith(github.ref, 'refs/tags/')
    && 'resumeme-tag-pipeline'
    || format('resumeme-{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:

  # Reuse the isolated publishing workflow within this run so a main push creates only one pipeline.
  scorecard-stage:
    name: OpenSSF Scorecard
    if: >-
      github.event.repository.fork == false
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (github.event_name == 'push'
      || github.event_name == 'schedule')
    uses: ./.github/workflows/stage-scorecard.yml
    permissions:
      contents: read
      id-token: write

  # Resolve once so every reusable stage consumes the same commit even if the branch advances during the run.
  source:
    name: Resolve pipeline source
    if: >-
      !(github.event_name == 'workflow_dispatch' && inputs.pages_only)
      && (github.event_name != 'schedule' || github.event.schedule != '43 6 * * 1')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      refresh: ${{ steps.source.outputs.refresh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: source
        env:
          REFRESH_PROFILE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh) }}
        run: bash scripts/ci/pipeline/source.sh

  # Authenticate and validate incoming figures in parallel with ordinary source checks, inside this pipeline.
  awareness:
    name: Verify awareness figures
    needs: source
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          groups: main
      - name: Verify sender, bundle digest, and image schema
        env:
          GH_TOKEN: ${{ github.token }}
        run: poetry run python scripts/ci/awareness/receive.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: awareness-figures
          path: data/awareness.json
          if-no-files-found: error
          retention-days: 1

  # Source-only validation starts before live capture; no browser, profile artifact, or model output is needed.
  test-stage:
    name: Test
    needs: source
    if: >-
      ${{ !cancelled()
      && needs.source.result == 'success' }}
    uses: ./.github/workflows/stage-test.yml
    with:
      sha: ${{ needs.source.outputs.sha }}

  security-stage:
    name: Security
    needs: source
    if: >-
      ${{ !cancelled()
      && needs.source.result == 'success' }}
    uses: ./.github/workflows/stage-security.yml
    with:
      sha: ${{ needs.source.outputs.sha }}

  readme-stage:
    name: Review README
    needs: source
    if: >-
      ${{ !cancelled()
      && needs.source.result == 'success' }}
    uses: ./.github/workflows/stage-readme.yml
    with:
      sha: ${{ needs.source.outputs.sha }}

  # Packages and the synthetic container smoke test need only source, so start them alongside browser capture.
  build-stage:
    name: Build package and container
    needs: source
    if: >-
      ${{ !cancelled()
      && needs.source.result == 'success' }}
    uses: ./.github/workflows/stage-build.yml
    with:
      sha: ${{ needs.source.outputs.sha }}

  # Validate real browser behavior without LinkedIn credentials; the PR run gates merge and main runs it again independently.
  browser-e2e-stage:
    name: Browser E2E
    needs: source
    if: >-
      ${{ !cancelled()
      && needs.source.result == 'success' }}
    uses: ./.github/workflows/stage-browser-e2e.yml
    with:
      sha: ${{ needs.source.outputs.sha }}

  capture-bootstrap:
    name: Authenticate and plan LinkedIn capture
    needs: source
    permissions:
      contents: read
      actions: read
    if: >-
      needs.source.outputs.refresh == 'true'
      && ((github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/'))
      || (github.ref == 'refs/heads/main'
      && (github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch')))
    runs-on: ${{ fromJSON(vars.RESUMEME_LINKEDIN_RUNNER || '["ubuntu-24.04"]') }}
    timeout-minutes: 45
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          groups: main

      # History-based adaptive scheduling learns from the latest complete capture, including sibling release tags.
      - name: Restore encrypted traversal timings
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_RUNNER: ${{ vars.RESUMEME_LINKEDIN_RUNNER || '["ubuntu-24.04"]' }}
          RESUMEME_CACHE_PRIVATE_KEY: ${{ secrets.RESUMEME_CACHE_PRIVATE_KEY }}
          RESUMEME_CACHE_PUBLIC_KEY: ${{ secrets.RESUMEME_CACHE_PUBLIC_KEY }}
          RESUMEME_CACHE_KEY_PASSWORD: ${{ secrets.RESUMEME_CACHE_KEY_PASSWORD }}
        run: poetry run python scripts/ci/linkedin/capture-timings.py restore

      # Fan-out begins with one authenticated overview and a plan frozen using historical durations or cold-start size weights.
      # LinkedIn credentials stay here; workers receive only the encrypted session-cache key.
      - name: Authenticate and build the section plan
        uses: ./.github/actions/linkedin-session
        with:
          command: capture-plan
          plan-path: .cache/capture/plan.json
          private-key: ${{ secrets.RESUMEME_CACHE_PRIVATE_KEY }}
          public-key: ${{ secrets.RESUMEME_CACHE_PUBLIC_KEY }}
          key-password: ${{ secrets.RESUMEME_CACHE_KEY_PASSWORD }}
          cache-directory: ${{ vars.RESUMEME_SESSION_CACHE_DIR }}
        env:
          # Stream capture progress and sanitized request diagnostics through the session wrapper.
          RESUMEME_LOG_LEVEL: DEBUG
          PYTHONUNBUFFERED: '1'
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
      - name: Export the frozen capture matrix
        id: matrix
        run: poetry run python scripts/ci/linkedin/capture-matrix.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resumeme-capture-plan
          path: .cache/capture/plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  capture-shards:
    name: Capture LinkedIn sections (${{ matrix.shard }}/${{ needs.capture-bootstrap.outputs.count }})
    needs: [source, capture-bootstrap]
    if: >-
      !cancelled()
      && needs.source.outputs.refresh == 'true'
      && needs.capture-bootstrap.result == 'success'
    runs-on: ${{ fromJSON(vars.RESUMEME_LINKEDIN_RUNNER || '["ubuntu-24.04"]') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        shard: ${{ fromJSON(needs.capture-bootstrap.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          groups: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resumeme-capture-plan
          path: .cache/capture/

      # Each worker restores an isolated copy of the configured browser cache and never overwrites the shared cache.
      - name: Collect assigned profile sections
        uses: ./.github/actions/linkedin-session
        with:
          command: capture-shard
          save-cache: 'false'
          shard-index: ${{ matrix.shard }}
          shard-count: ${{ needs.capture-bootstrap.outputs.count }}
          plan-path: .cache/capture/plan.json
          shard-output: .cache/capture/shards/shard-${{ matrix.shard }}.json
          private-key: ${{ secrets.RESUMEME_CACHE_PRIVATE_KEY }}
          public-key: ${{ secrets.RESUMEME_CACHE_PUBLIC_KEY }}
          key-password: ${{ secrets.RESUMEME_CACHE_KEY_PASSWORD }}
          cache-directory: ${{ vars.RESUMEME_SESSION_CACHE_DIR }}
        env:
          RESUMEME_LOG_LEVEL: DEBUG
          PYTHONUNBUFFERED: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resumeme-capture-shard-${{ matrix.shard }}
          path: .cache/capture/shards/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  capture:
    name: Aggregate LinkedIn profile
    needs: [source, capture-bootstrap, capture-shards]
    if: >-
      !cancelled()
      && needs.source.outputs.refresh == 'true'
      && needs.capture-bootstrap.result == 'success'
      && needs.capture-shards.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          groups: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resumeme-capture-plan
          path: .cache/capture/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: resumeme-capture-shard-*
          path: .cache/capture/shards/
          merge-multiple: true
      # Fan-in is strict: incomplete or mismatched shards prevent profile publication.
      - name: Validate and aggregate all planned profile shards
        env:
          # Emit observed mean, population standard deviation, and prediction residuals without profile text.
          RESUMEME_LOG_LEVEL: INFO
        run: poetry run resumeme --config resumeme.config.yaml aggregate
      # Fresh data retains the same schema checks without delaying source-only tests behind the browser.
      - name: Check the accepted profile and schema contracts
        run: |
          poetry run python scripts/validation/check-data.py
          poetry run resumeme --config resumeme.config.yaml validate
      - name: Export complete capture for downstream stages
        run: poetry run python scripts/ci/linkedin/profile-artifact.py export
      # Project only aggregate evidence; profile fields and per-route timings stay out of the public plot artifact.
      - name: Collect tag convergence measurements
        id: convergence
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          CAPTURE_RUNNER: ${{ vars.RESUMEME_LINKEDIN_RUNNER || '["ubuntu-24.04"]' }}
        run: |
          poetry run python scripts/ci/publication/convergence.py enabled >>"$GITHUB_OUTPUT"
          poetry run python scripts/ci/publication/convergence.py collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.convergence.outputs.enabled == 'true'
        with:
          name: capture-convergence
          path: .cache/convergence/current.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      # Publish feedback only after complete aggregation and validation; failed workers never train the next run.
      - name: Encrypt traversal timings for the next run
        id: timings
        env:
          CAPTURE_RUNNER: ${{ vars.RESUMEME_LINKEDIN_RUNNER || '["ubuntu-24.04"]' }}
          RESUMEME_CACHE_PRIVATE_KEY: ${{ secrets.RESUMEME_CACHE_PRIVATE_KEY }}
          RESUMEME_CACHE_PUBLIC_KEY: ${{ secrets.RESUMEME_CACHE_PUBLIC_KEY }}
          RESUMEME_CACHE_KEY_PASSWORD: ${{ secrets.RESUMEME_CACHE_KEY_PASSWORD }}
        run: poetry run python scripts/ci/linkedin/capture-timings.py seal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.timings.outputs.artifact-name }}
          path: .cache/capture-timings/timings.bin
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resumeme-profile
          path: .cache/refresh/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  summary-stage:
    name: Summarize
    needs: [source, capture]
    if: >-
      !cancelled()
      && needs.source.result == 'success'
      && ((needs.source.outputs.refresh == 'true'
      && needs.capture.result == 'success')
      || (needs.source.outputs.refresh != 'true'
      && needs.capture.result == 'skipped'))
    uses: ./.github/workflows/stage-summary.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      refresh: ${{ needs.source.outputs.refresh == 'true' }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # Keep PR feedback in the same pipeline as the Trivy scan that produced its sanitized report.
  trivy-pr-comment:
    name: Trivy PR summary
    needs: [source, security-stage]
    if: >-
      always()
      && github.event_name == 'pull_request'
      && needs.source.result == 'success'
      && needs.security-stage.result != 'cancelled'
      && needs.security-stage.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # Use trusted default-branch code to interpret the sanitized artifact, never scripts from the PR checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: trivy-scan-report
          path: ${{ runner.temp }}/trivy-results

      - name: Resolve the report and create a safe comment payload
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "trivy-scan-report")][0].id // empty')
          artifact_url=
          if [[ -n "$artifact_id" ]]; then
              artifact_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts/$artifact_id"
          fi
          python3 scripts/ci/checks/trivy-report.py comment \
            --input "$RUNNER_TEMP/trivy-results/trivy-report.json" \
            --output "$RUNNER_TEMP/trivy-comment.json" \
            --artifact-url "$artifact_url" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"

      - name: Create or update the pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          existing_comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- resumeme-trivy-scan -->")) | .id' | tail -n 1)
          if [[ -n "$existing_comment_id" ]]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing_comment_id" \
                --input "$RUNNER_TEMP/trivy-comment.json"
          else
              gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
                --input "$RUNNER_TEMP/trivy-comment.json"
          fi

  # Both document consumers use identical capture and summary artifacts but run in parallel on separate runners.
  documents-stage:
    name: Review documents
    needs: [source, summary-stage, awareness]
    if: >-
      ${{ !cancelled()
      && needs.source.result == 'success'
      && needs.summary-stage.result == 'success'
      && (needs.awareness.result == 'success' || needs.awareness.result == 'skipped') }}
    uses: ./.github/workflows/stage-documents.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      refresh: ${{ needs.source.outputs.refresh == 'true' }}
      summary: ${{ needs.summary-stage.outputs.generated == 'true' }}
  resume-stage:
    name: Build resume
    needs: [source, summary-stage, awareness]
    if: >-
      ${{ !cancelled()
      && needs.source.result == 'success'
      && needs.summary-stage.result == 'success'
      && (needs.awareness.result == 'success' || needs.awareness.result == 'skipped') }}
    uses: ./.github/workflows/stage-resume.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      refresh: ${{ needs.source.outputs.refresh == 'true' }}
      summary: ${{ needs.summary-stage.outputs.generated == 'true' }}

  # Run the gate after failures too; a skipped or cancelled upstream stage must never look like successful verification.
  verified:
    name: CI verification
    if: >-
      always()
      && !(github.event_name == 'workflow_dispatch' && inputs.pages_only)
      && !(github.event_name == 'schedule'
      && github.event.schedule == '43 6 * * 1')
    needs:
      - source
      - awareness
      - capture
      - summary-stage
      - test-stage
      - security-stage
      - readme-stage
      - build-stage
      - browser-e2e-stage
      - documents-stage
      - resume-stage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all stages to succeed
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e '
            ([.source, .["summary-stage"], .["test-stage"], .["security-stage"], .["readme-stage"],
              .["build-stage"], .["browser-e2e-stage"], .["documents-stage"], .["resume-stage"]] |
              all(.result == "success")) and
            (if .source.outputs.refresh == "true" then .capture.result == "success" else .capture.result == "skipped" end) and
            (.awareness.result == "success" or .awareness.result == "skipped")
          ' <<<"$RESULTS_JSON"

  # Coverage reporting is a leaf job, independent of PDF publication and required verification.
  coverage-badge:
    name: Publish coverage badge
    needs: [source, test-stage]
    if: >-
      !cancelled()
      && needs.source.result == 'success'
      && needs.test-stage.result == 'success'
      && github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: resumeme-coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-coverage
          path: .cache/coverage
      - name: Generate badge from the combined test report
        run: python scripts/ci/checks/coverage-badge.py

      # Read main inside the publication lock so an older completed run cannot replace a newer coverage result.
      - id: current
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          current=$(bash scripts/tooling/retry.sh gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          if [[ "$current" == "$SOURCE_SHA" ]]; then
              echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
              echo 'Skipping coverage badge: the default branch has advanced.'
          fi

      # The raw GitHub badge URL is independent of the Pages deployment serving the resume PDF.
      - uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        if: steps.current.outputs.publish == 'true'
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: .cache/coverage-badge
          destination_dir: badges
          keep_files: true
          disable_nojekyll: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Update Python coverage badge

  # PDF publication owns repository writes and only runs for main, after the common verification gate.
  deploy-stage:
    name: Publish PDF
    needs: [source, verified]
    # Token-authenticated publication commits run normal CI, but their parent run already published these outputs.
    # Gate only republishing on a main push; tagging that generated commit must still capture and release normally.
    if: >-
      !cancelled()
      && needs.source.result == 'success'
      && needs.verified.result == 'success'
      && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && !(github.event_name == 'push'
      && github.event.head_commit.author.name == 'github-actions[bot]'
      && contains(github.event.head_commit.message, 'Resumeme-Publication: true'))
    uses: ./.github/workflows/stage-deploy.yml
    permissions:
      contents: write
    with:
      sha: ${{ needs.source.outputs.sha }}
      refresh: ${{ needs.source.outputs.refresh == 'true' }}
    secrets:
      # The upstream organization shares its protected-branch publication token; forks use their own dedicated secret.
      RESUME_PUBLISH_TOKEN: ${{ secrets.RESUME_PUBLISH_TOKEN || (github.repository == 'astrivant/resumeme' && secrets.BENCHMARK_PUBLISH_TOKEN) || '' }}

  # Pages consumes the accepted main commit in this run; bot commits do not trigger another workflow with GITHUB_TOKEN.
  pages-stage:
    name: Publish resume website
    needs: deploy-stage
    if: >-
      !cancelled()
      && needs.deploy-stage.result == 'success'
      && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && needs.deploy-stage.outputs.published-sha != ''
    uses: ./.github/workflows/stage-pages.yml
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    with:
      sha: ${{ needs.deploy-stage.outputs.published-sha }}

  # Recover a served site independently of capture/build work, within this same pipeline.
  pages-recovery-stage:
    name: Republish accepted resume website
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.pages_only
      && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/stage-pages.yml
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    with:
      sha: ${{ github.sha }}

  # A verified tag also places its signed PDF and fresh capture on main after release publication.
  tag-publish-stage:
    name: Commit signed PDF to main
    needs: [source, release-stage]
    if: >-
      !cancelled()
      && needs.source.result == 'success'
      && needs.release-stage.result == 'success'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/stage-tag-publish.yml
    permissions:
      contents: write
      actions: read
    with:
      sha: ${{ needs.source.outputs.sha }}
    secrets:
      RESUME_PUBLISH_TOKEN: ${{ secrets.RESUME_PUBLISH_TOKEN || (github.repository == 'astrivant/resumeme' && secrets.BENCHMARK_PUBLISH_TOKEN) || '' }}

  # The tag publication push uses GITHUB_TOKEN and will not start a branch workflow, so deploy its accepted PDF here.
  tag-pages-stage:
    name: Publish signed resume website
    needs: tag-publish-stage
    if: >-
      !cancelled()
      && needs.tag-publish-stage.result == 'success'
      && needs.tag-publish-stage.outputs.published-sha != ''
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/stage-pages.yml
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    with:
      sha: ${{ needs.tag-publish-stage.outputs.published-sha }}

  # Tags capture LinkedIn first and release the PDF built from that capture; branch and monthly runs create no release.
  release-stage:
    name: Release signed PDF
    needs: [source, verified]
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/stage-release.yml
    permissions:
      contents: write
    with:
      sha: ${{ needs.source.outputs.sha }}
    secrets:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

  # Profile writes are a separate opt-in stage; login failures leave the published release and container stage intact.
  ownership-stage:
    name: Publish signing identity to LinkedIn
    needs: [source, release-stage]
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/stage-ownership.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
    secrets:
      LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
      LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
      RESUMEME_CACHE_PRIVATE_KEY: ${{ secrets.RESUMEME_CACHE_PRIVATE_KEY }}
      RESUMEME_CACHE_PUBLIC_KEY: ${{ secrets.RESUMEME_CACHE_PUBLIC_KEY }}
      RESUMEME_CACHE_KEY_PASSWORD: ${{ secrets.RESUMEME_CACHE_KEY_PASSWORD }}

  # Saved application resumes use the verified signed artifact in a separate, explicitly enabled tag job.
  linkedin-resume-stage:
    name: Optionally upload the released resume to LinkedIn
    needs: [source, release-stage]
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/stage-linkedin-resume.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
    secrets:
      LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
      LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
      RESUMEME_CACHE_PRIVATE_KEY: ${{ secrets.RESUMEME_CACHE_PRIVATE_KEY }}
      RESUMEME_CACHE_PUBLIC_KEY: ${{ secrets.RESUMEME_CACHE_PUBLIC_KEY }}
      RESUMEME_CACHE_KEY_PASSWORD: ${{ secrets.RESUMEME_CACHE_KEY_PASSWORD }}

  # Tagged skill evidence is independent of summaries, builds, and signing; only live additions wait for release.
  skills-stage:
    name: Propose LinkedIn skills
    needs: [source, capture]
    if: >-
      !cancelled()
      && needs.source.result == 'success'
      && needs.capture.result == 'success'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/stage-skills.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      refresh: ${{ needs.source.outputs.refresh == 'true' }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  skills-publish-stage:
    name: Publish LinkedIn skills
    needs: [source, skills-stage, release-stage]
    if: >-
      !cancelled()
      && needs.source.result == 'success'
      && needs.skills-stage.result == 'success'
      && needs.release-stage.result == 'success'
      && needs.skills-stage.outputs.publish == 'true'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/stage-skills-publish.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      refresh: ${{ needs.source.outputs.refresh == 'true' }}
    secrets:
      LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
      LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
      RESUMEME_CACHE_PRIVATE_KEY: ${{ secrets.RESUMEME_CACHE_PRIVATE_KEY }}
      RESUMEME_CACHE_PUBLIC_KEY: ${{ secrets.RESUMEME_CACHE_PUBLIC_KEY }}
      RESUMEME_CACHE_KEY_PASSWORD: ${{ secrets.RESUMEME_CACHE_KEY_PASSWORD }}

  # Version tags publish the verified Python distributions; the PyPI credential reaches only this stage.
  pypi-stage:
    name: Publish Python package
    needs: [source, verified]
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/stage-pypi.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  # Registry uploads and the signed PDF release share verification but do not wait for each other.
  container-stage:
    name: Publish container
    needs: [source, verified]
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/stage-container.yml
    permissions:
      contents: read
      packages: write
    with:
      sha: ${{ needs.source.outputs.sha }}
    secrets:
      DOCKER_HUB_TOKEN_EMMEOWZING: ${{ secrets.DOCKER_HUB_TOKEN_EMMEOWZING }}

  # Advertise successful registry pushes only after the signed release exists; avoid racing the release-note writer.
  container-notes-stage:
    name: Publish container pull commands
    needs: [source, container-stage, release-stage]
    if: >-
      !cancelled()
      && needs.source.result == 'success'
      && needs.release-stage.result == 'success'
      && (needs.container-stage.outputs.ghcr-tags != ''
      || needs.container-stage.outputs.dockerhub-tags != '')
    uses: ./.github/workflows/stage-container-notes.yml
    permissions:
      contents: write
    with:
      sha: ${{ needs.source.outputs.sha }}
      image-tags: |
        ${{ needs.container-stage.outputs.ghcr-tags }}
        ${{ needs.container-stage.outputs.dockerhub-tags }}
