# Base configuration matching package defaults. Copy to resumeme.config.yaml and set profile.linkedin.username.
# The reference contains no personal exclusions, credentials, or live publication opt-ins.
# Credentials belong in environment variables or GitHub Actions secrets.

# Cross-cutting runtime diagnostics.
logging:
  level: ERROR

# Browser and network behavior used while acquiring and enriching a profile.
capture:
  # Start with six workers; resize by one only when measured time/cost savings justify it.
  sharding:
    enabled: true
    initial: 6
    minimum: 2
    maximum: 8
    cooldown_runs: 3
  browser: firefox
  page_timeout_seconds: 30
  app_approval_timeout_seconds: 900
  max_scrolls: 60
  max_pages_per_section: 30
  fetch_link_previews: true
  retry_attempts: 5
  retry_backoff_seconds: 10
  retry_max_backoff_seconds: 300

# Profile identity and section selection.
profile:
  linkedin:
    username: your-linkedin-username
  github:
    username: null
    contributions:
      enabled: false
      months: 1
      placement: profile
      as_of: null
  sections:
    order:
      - contact
      - about
      # - featured
      # - activity
      - experience
      - education
      # - services
      # - career-breaks
      # - certifications
      # - volunteering-experiences
      - projects
      - publications
      # - patents
      # - courses
      # - honors
      # - test-scores
      - skills
      # - recommendations
      # - languages
      # - organizations
      # - interests
      # - causes
    projects:
      source_url_filter: '(?i)^https?://(?:www\.)?github\.com(?:[/?#]|$)'
      include: null
      exclude: []
    experience:
      disable: []
      last_years: null
      since: null
      as_of: null
      reflow_soft_breaks: true
      subheadings:
        - Responsibilities
        - Key responsibilities
        - Technologies
        - Projects
        - Skills
        - Achievements
        - Key achievements
        - Accomplishments
        - Highlights
        - Summary
        - Duties
    education:
      disable: []

# Resume compilation inputs, generated paths, and visual presentation.
document:
  # Optional evidence figures. Reorder these keys; include narrows enabled figures and exclude wins.
  appendices:
    awareness:
      figures:
        knowledge-usage: false
        knowledge-map: false
        decision-influences: false
        knowledge-hierarchy: false
        toolbox-use: false
        problem-repertoire: false
        checkpoint-transitions: false
        checkpoint-comparisons: false
      include: [] # For example: [{group: knowledge}] or [{id: knowledge-usage}]
      exclude: [] # Filters accept id, group, or both.

  output:
    profile: data/profile.json
    assets: data/assets
    tex: tex/resume.tex
    pdf: resume.pdf
  style:
    profile_column_side: left
    profile_column_wrap: false
    # Fractions of the available body width, after indentation; the identity sidebar is independent.
    first_page_body_width: 1.0
    later_page_body_width: 0.9
    # Caption blocks stay centered below figures; alignment controls the text inside them.
    figure_caption_width: 0.8
    figure_caption_alignment: center # left, center, or right
    paper: letter
    accent: '245135'
    background: FFFFFF
    ink: '363636'
    name_color: '191919'
    heading_color: '191919'
    entry_color: '363636'
    company_font_size: 13
    company_color: '191919'
    line_height: 1.0
    paragraph_spacing: 3
    about_text_indent: 8
    about_background: null
    font_size: 10
    show_header_photo: true
    display_profile_photo: true
    display_location: true
    show_headline: false
    display_current_position: null
    show_table_of_contents: true
    highlight_job_subheadings: true
    show_connection_count: false
    show_connection_link: false
    display_birthday: false
    display_websites: false
    display_phone: true
    website_icon: null
    skills_word_cloud: true
    skills_allow_vertical: false
    skills_size_legend: false
    skill_colors: ['363636', '777777']
    theme: null
    themes: {}
  template: null

# External publication targets. All live writes are disabled by default.
publishing:
  linkedin:
    resume:
      publish: false
      replace_existing: false
      share_with_recruiters: null
    ownership:
      update_about: false
      repository: null
      releases_url: null
  readme:
    mode: auto
    output: README.md
    introduction: null
    convergence_plot: docs/assets/capture-convergence.svg
  pages:
    enabled: false
    path: /
    custom_domain: null

# Optional AI-assisted generation. It requires OPENAI_API_KEY when enabled.
automation:
  # Accept GitHub-authenticated rebuild requests only from explicitly allowed account/App logins.
  awareness:
    enabled: false
    allowed_actors: []

  codex:
    enabled: false
    model: null
    reasoning_effort: null
    about_max_words: 100
    headline_max_words: 18
    context: ''
    skills:
      enabled: false
      publish: false
      max_skills: 20
      context: ''
    companies: []
